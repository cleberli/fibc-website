<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F0FA"/>
      <stop offset="100%" stop-color="#F8F9FA"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#D4B886"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Bag shape -->
  <path d="M 130 80 L 270 80 L 290 280 L 110 280 Z" fill="url(#bag)" stroke="#8B6F47" stroke-width="2"/>
  <!-- Top loops -->
  <path d="M 150 80 Q 165 50 180 80" stroke="#8B6F47" stroke-width="3" fill="none"/>
  <path d="M 220 80 Q 235 50 250 80" stroke="#8B6F47" stroke-width="3" fill="none"/>
  <!-- Logo/text -->
  <text x="200" y="170" text-anchor="middle" font-family="Arial" font-size="22" fill="#0056A6" font-weight="bold">FIBC</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">1000kg / 5:1</text>
  <text x="200" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#999">Standard Bag</text>
</svg>