<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F0FA"/>
      <stop offset="100%" stop-color="#F8F9FA"/>
    </linearGradient>
    <linearGradient id="bag6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg6)"/>
  <!-- Woven bag - rectangle -->
  <rect x="100" y="80" width="200" height="200" fill="url(#bag6)" stroke="#999" stroke-width="2"/>
  <!-- Woven pattern -->
  <g opacity="0.3">
    <line x1="100" y1="100" x2="300" y2="100" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="120" x2="300" y2="120" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="140" x2="300" y2="140" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="160" x2="300" y2="160" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="180" x2="300" y2="180" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="200" x2="300" y2="200" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="220" x2="300" y2="220" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="240" x2="300" y2="240" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="260" x2="300" y2="260" stroke="#999" stroke-width="1"/>
    <line x1="130" y1="80" x2="130" y2="280" stroke="#999" stroke-width="1"/>
    <line x1="160" y1="80" x2="160" y2="280" stroke="#999" stroke-width="1"/>
    <line x1="190" y1="80" x2="190" y2="280" stroke="#999" stroke-width="1"/>
    <line x1="220" y1="80" x2="220" y2="280" stroke="#999" stroke-width="1"/>
    <line x1="250" y1="80" x2="250" y2="280" stroke="#999" stroke-width="1"/>
    <line x1="280" y1="80" x2="280" y2="280" stroke="#999" stroke-width="1"/>
  </g>
  <text x="200" y="180" text-anchor="middle" font-family="Arial" font-size="20" fill="#0056A6" font-weight="bold">PP WOVEN</text>
  <text x="200" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">BAG</text>
</svg>